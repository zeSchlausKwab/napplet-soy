<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MiniCraft · local backend demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px Trebuchet MS,
          sans-serif;
        background: #183c43;
        color: #e5f4ef;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        min-height: 44px;
        padding: 8px 16px;
      }
      header a {
        color: inherit;
      }
      header span {
        color: #a5d2c7;
      }
      #stage {
        flex: 1;
        min-height: 0;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      dialog {
        max-width: min(440px, 90vw);
        border: 0;
        border-radius: 15px;
        padding: 25px;
        color: #183c43;
        background: #fffdf2;
        box-shadow: 0 20px 120px #0007;
      }
      dialog::backdrop {
        background: #123a4480;
      }
      dialog p {
        line-height: 1.6;
        overflow-wrap: anywhere;
      }
      button {
        padding: 12px 20px;
        border-radius: 8px;
        border: 0;
        cursor: pointer;
        font: inherit;
        background: #ec6042;
        color: white;
        margin-right: 8px;
      }
      button.secondary {
        background: #d6e7df;
        color: #183c43;
      }
      #host-error {
        padding: 25px;
        color: #ffdbb2;
        white-space: pre-wrap;
      }
      @media (max-width: 600px) {
        header {
          font-size: 10px;
          padding: 8px;
        }
        header span {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>MiniCraft / local playground</strong
      ><span id="identity">Starting a temporary demo player…</span
      ><a href="http://127.0.0.1:3000/" target="_blank" rel="noopener">napplet.soy ↗</a>
    </header>
    <div id="stage"></div>
    <div id="host-error" hidden role="alert"></div>
    <dialog id="consent">
      <h2>Connect your demo player</h2>
      <p id="detail"></p>
      <p>
        This identity is temporary and stays in this browser tab. No real account or keychain is
        used.
      </p>
      <button id="allow">Allow</button><button id="cancel" class="secondary">Cancel</button>
    </dialog>
    <script type="module" src="/runtime.js"></script>
  </body>
</html>
