<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Orbit Run · presentation prototype</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b1a1c;
        color: #efe9d6;
        font: 15px system-ui;
        min-height: 100svh;
        display: grid;
        place-content: center;
      }
      main {
        width: min(1024px, 100vw);
      }
      canvas {
        width: 100%;
        display: block;
        aspect-ratio: 8/5;
      }
      nav {
        padding: 22px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        border: 1px solid #638071;
        border-radius: 30px;
        background: #213b30;
        color: #f5eddb;
        padding: 12px 18px;
        cursor: pointer;
      }
      p {
        color: #a2b3a5;
        line-height: 1.5;
        margin: 0;
        padding: 0 22px 20px;
      }
      html.capture body {
        display: block;
      }
      html.capture nav,
      html.capture p {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas width="1024" height="640" aria-label="Orbit Run marble course"></canvas>
      <nav>
        <button id="restart">Restart · R</button
        ><button id="variant">Switch original / portals</button
        ><button id="auto">Toggle demo run</button><span>Arrow keys or WASD to roll.</span>
      </nav>
      <p>A playable local recording prototype. No account, scores or activity are sent anywhere.</p>
    </main>
    <script>
      if (new URLSearchParams(location.search).has('capture'))
        document.documentElement.className = 'capture';
    </script>
    <script type="module" src="game.js"></script>
  </body>
</html>
